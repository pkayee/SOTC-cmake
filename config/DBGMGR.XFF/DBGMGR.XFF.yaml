      type: textbin
      start: 0x0
      vram: 0x40010000
      size: 0x948
      align: 1
      subalign: 1
    - name: text
      type: code
      start: 0x948
      vram: 0x40010948
      bss_size: 0x120
      subalign: 8
      align: 8
      subsegments:
