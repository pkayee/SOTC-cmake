    - name: data
      type: data
      start: 0xdec0
      vram: 0x4001dec0
      subalign: 16
      align: 16
      subsegments:
        - [ 0xdec0, data, all_data ]
    - name: rodata
      type: rodata
      start: 0xe0b0
      vram: 0x4001e0b0
      subalign: 8
      align: 8
      subsegments:
        - [ 0xe0b0, rodata, all_rodata ]
    - name: xff_footer
      type: rodatabin
      start: 0xee7c
      vram: 0x4001ee7c
      size: 0x9a1c
      align: 1
      subalign: 1
    - [0x18898]
