    find_file_boundaries: True
    section_order: [".text", ".data", ".rodata", ".lit4", ".sdata", ".sbss", ".bss"]
segments:
    - name: xff_header
      type: textbin
      start: 0x0
      vram: 0x40010000
      size: 0x4a60
      align: 1
      subalign: 1
    - name: text
      type: code
      start: 0x4a60
      vram: 0x40014a60
      bss_size: 0x1b300
      subalign: 8
      align: 8
      subsegments:
        - [ 0x4a60, asm, all_text ]
        - { type: bss, vram: 0x401aa940, name: bss, size: 0x1b300 }
    - name: vutext
      type: textbin
      start: 0xfa048
      vram: 0x4010a048
      size: 0x1a3f8
      align: 1
      subalign: 1
    - name: data
      type: data
      start: 0x114440
      vram: 0x40124440
      subalign: 16
      align: 16
      subsegments:
        - [ 0x114440, data, all_data ]
    - name: rodata
      type: rodata
      start: 0x11f100
      vram: 0x4012f100
      subalign: 8
      align: 8
      subsegments:
        - [ 0x11f100, rodata, all_rodata ]
    - name: xff_footer
      type: rodatabin
      start: 0x125df4
      vram: 0x40135df4
      size: 0x74b4c
      align: 1
      subalign: 1
    - [0x19a940]
