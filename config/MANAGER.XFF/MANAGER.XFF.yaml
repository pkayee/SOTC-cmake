options:
    basename: MANAGER.XFF
    target_path: iso/MANAGER.XFF
    base_path: ../..
    asm_path: asm/MANAGER.XFF
    asset_path: assets/MANAGER.XFF
    src_path: src/MANAGER.XFF
    build_path: build/MANAGER.XFF
    symbol_addrs_path:
        - config/MANAGER.XFF/MANAGER.XFF_symbols.txt
        - config/MANAGER.XFF/MANAGER.XFF_ignore_symbols.txt
    reloc_addrs_path: config/MANAGER.XFF/MANAGER.XFF_relocs.txt
    ld_bss_contains_common: True
    ld_bss_is_noload: True
    create_undefined_funcs_auto: True
